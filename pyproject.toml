[project]
name = "slam-eval"
description = "Evaluation library for LLMs and other foundational models"
dynamic = ["version"]
authors = [
  {name = "Anton Pershin", email = "tony.pershin@gmail.com"},
]
readme = "README.md"
requires-python = ">= 3.12"
dependencies = [
  # For local dev, override with: pip install -e ../slam-core
  "slam-core @ git+https://github.com/anton-pershin/slam-core.git",
  "hydra-core >= 1.3",
  "setuptools",
  "pytest",
  "datasets",
  "requests",
  "nltk",
  "emoji",
  "syllapy",
  "torch",
  "transformers",
  "accelerate",
  "scikit-learn",
  "rally @ git+https://github.com/anton-pershin/rally.git",
  "kygs @ git+https://github.com/anton-pershin/kygs.git",
]

[build-system]
requires = ["hatchling >= 1.26", "versioningit"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.version]
source = "versioningit"

[tool.versioningit]
default-version = "0.0.0"

[tool.isort]
line_length = 88
known_third_party = "hydra, rally"

[tool.pylint]
max-line-length = 88
min-similarity-lines = 12

[tool.pylint.'MESSAGES CONTROL']
disable = [
    "missing-docstring",      # Disable docstring requirements
    "too-few-public-methods", # Allow classes with few methods
    "too-many-arguments",
    "too-many-positional-arguments",
    "wrong-import-order",     # Already addressed by isort
    "too-many-instance-attributes",
    "too-many-locals",
    "no-else-return",
    "too-many-return-statements",
    "too-many-branches",      # performance collectors parse branching protocols
    "too-many-statements",
    "broad-exception-caught", # monitor/sampler must never crash the eval loop
    "import-outside-toplevel",# lazy heavy/optional imports (pynvml, torch)
    "redefined-outer-name",   # optional-dependency import pattern (pynvml, urllib.error)
    "reimported",
    "attribute-defined-outside-init",  # TokenTimingState reset pattern
    "unused-argument",        # lifecycle hook signatures are part of the contract
]

[tool.pylint.'TYPECHECK']
ignored-modules = ["pynvml", "psutil"]

[tool.mypy]
disable_error_code = ["import-untyped"]

[[tool.mypy.overrides]]
module = ["pynvml", "psutil"]
ignore_missing_imports = true
